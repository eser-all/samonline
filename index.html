<section class="glass rounded-2xl p-5 mb-5"><h2 class="font-bold text-lg mb-4">➕ নতুন Complaint</h2><form id="form" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"><div><label class="label">Zone</label><select id="zone" class="input" required></select></div><div><label class="label">Customer</label><input id="customer" class="input" required></div><div><label class="label">Phone</label><input id="phone" class="input" required></div><div><label class="label">Problem</label><input id="problem" class="input" required></div><div><label class="label">Address</label><input id="address" class="input"></div><div><label class="label">Technician</label><input id="technician" class="input"></div><div><label class="label">Priority</label><select id="priority" class="input"><option>Normal</option><option>High</option><option>Urgent</option></select></div><div><label class="label">Status</label><select id="status" class="input"><option>Running</option><option>Hold</option><option>Completed</option></select></div><div class="flex items-end"><button id="save" class="w-full py-3 rounded-xl bg-sky-500 text-slate-950 font-bold">Save & Send Telegram</button></div></form></section>
<section class="glass rounded-2xl p-4 mb-4"><div class="grid md:grid-cols-4 gap-3"><input id="search" class="input" placeholder="🔎 Search"><select id="fz" class="input"><option value="">সব Zone</option></select><select id="fs" class="input"><option value="">সব Status</option><option>Running</option><option>Hold</option><option>Completed</option></select><select id="fp" class="input"><option value="">সব Priority</option><option>Normal</option><option>High</option><option>Urgent</option></select></div></section>
<section class="glass rounded-2xl overflow-hidden"><div class="p-4 border-b border-slate-800 flex justify-between"><b>Complaint List</b><span id="count" class="text-xs text-slate-400">0</span></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-900"><tr><th class="p-3 text-left">Token</th><th class="p-3 text-left">Zone</th><th class="p-3 text-left">Customer</th><th class="p-3 text-left">Phone</th><th class="p-3 text-left">Problem</th><th class="p-3 text-left">Priority</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Telegram</th><th class="p-3">Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><div id="toasts" class="fixed bottom-4 right-4 z-[100] space-y-2"></div>
<script>
/* ====== ONLY CHANGE THESE TWO SETTINGS ====== */
const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT.firebasestorage.app",messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"};
const TELEGRAM_WORKER_URL="https://YOUR-WORKER.workers.dev";
/* Telegram Bot Token NEVER goes in this HTML. Put it in Cloudflare Worker Secret. */
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let me=null,unsub=null,data=[];
const $=id=>document.getElementById(id),zones=Array.from({length:55},(_,i)=>`D-${i+1}`);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(m,type='info'){const x=document.createElement('div');x.className='toast rounded-xl border px-4 py-3 text-sm shadow-xl '+(type==='error'?'bg-red-500/15 border-red-500/30 text-red-200':type==='success'?'bg-emerald-500/15 border-emerald-500/30 text-emerald-200':'bg-sky-500/15 border-sky-500/30 text-sky-200');x.textContent=m;$('toasts').appendChild(x);setTimeout(()=>x.remove(),3500)}
$('zone').innerHTML='<option value="">Select Zone</option>'+zones.map(z=>`<option>${z}</option>`).join('');$('fz').innerHTML+='<option value="">সব Zone</option>'+zones.map(z=>`<option>${z}</option>`).join('');$('showPass').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);const c=await r.user.getIdTokenResult(true);if(c.claims.admin!==true){await auth.signOut();throw Error('এই account-এ admin=true claim নেই।')} }catch(err){$('loginError').textContent=err.message;$('loginError').classList.remove('hidden')}finally{$('loginBtn').disabled=false}};
auth.onAuthStateChanged(async u=>{me=u;if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');if(unsub)unsub();return}const c=await u.getIdTokenResult(true);if(c.claims.admin!==true){await auth.signOut();toast('Admin permission নেই','error');return}$('user').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');listen()});$('logout').onclick=()=>auth.signOut();
function listen(){if(unsub)unsub();unsub=db.collection('complaints').orderBy('createdAt','desc').onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast('Firestore access denied: Rules/admin claim check করুন','error'))}
function filtered(){const q=$('search').value.toLowerCase(),z=$('fz').value,s=$('fs').value,p=$('fp').value;return data.filter(x=>(!q||[x.token,x.user,x.phone,x.problem,x.address,x.technician].join(' ').toLowerCase().includes(q))&&(!z||x.zone===z)&&(!s||x.status===s)&&(!p||x.priority===p))}
function badge(v,type){const c=type==='status'?(v==='Completed'?'text-emerald-300 bg-emerald-500/10':v==='Running'?'text-amber-300 bg-amber-500/10':'text-slate-300 bg-slate-500/10'):(v==='Urgent'?'text-red-300 bg-red-500/10':v==='High'?'text-orange-300 bg-orange-500/10':'text-sky-300 bg-sky-500/10');return `<span class="px-2 py-1 rounded-full text-xs ${c}">${esc(v)}</span>`}
function render(){const a=filtered();$('count').textContent=a.length+' results';$('total').textContent=data.length;$('running').textContent=data.filter(x=>x.status==='Running').length;$('completed').textContent=data.filter(x=>x.status==='Completed').length;$('high').textContent=data.filter(x=>x.priority==='High'||x.priority==='Urgent').length;$('sent').textContent=data.filter(x=>x.telegramStatus==='sent').length;$('rows').innerHTML=a.length?a.map(x=>`<tr class="border-t border-slate-800"><td class="p-3 text-sky-300 font-bold">${esc(x.token)}</td><td class="p-3">${esc(x.zone)}</td><td class="p-3">${esc(x.user)}</td><td class="p-3">${esc(x.phone)}</td><td class="p-3">${esc(x.problem)}</td><td class="p-3">${badge(x.priority,'priority')}</td><td class="p-3">${badge(x.status,'status')}</td><td class="p-3">${x.telegramStatus==='sent'?'<span class="text-emerald-300">✓ Sent</span>':x.telegramStatus==='failed'?'<span class="text-red-300">✕ Failed</span>':'<span class="text-amber-300">Pending</span>'}</td><td class="p-3"><button onclick="del('${x.id}')" class="text-red-300 px-2"><i class="fa-solid fa-trash"></i></button></td></tr>`).join(''):`<tr><td colspan="9" class="p-8 text-center text-slate-500">কোনো complaint নেই</td></tr>`}
['search','fz','fs','fp'].forEach(id=>$(id).addEventListener('input',render));
function token(){return'T-'+Math.floor(100000+Math.random()*900000)}async function telegram(c){if(TELEGRAM_WORKER_URL.includes('YOUR-WORKER'))throw Error('TELEGRAM_WORKER_URL সেট করুন');const msg=`<b>🚨 SAM ONLINE ISP — NEW COMPLAINT</b>\n\n🎫 <b>Token:</b> ${esc(c.token)}\n📍 <b>Zone:</b> ${esc(c.zone)}\n👤 <b>Customer:</b> ${esc(c.user)}\n📞 <b>Phone:</b> ${esc(c.phone)}\n🔧 <b>Problem:</b> ${esc(c.problem)}\n🏠 <b>Address:</b> ${esc(c.address||'-')}\n👨‍🔧 <b>Technician:</b> ${esc(c.technician||'Pending')}\n⚡ <b>Priority:</b> ${esc(c.priority)}\n📊 <b>Status:</b> ${esc(c.status)}`;const r=await fetch(TELEGRAM_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.description||'Telegram send failed');return j}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const c={token:token(),zone:$('zone').value,user:$('customer').value.trim(),phone:$('phone').value.trim(),problem:$('problem').value.trim(),address:$('address').value.trim(),technician:$('technician').value.trim(),priority:$('priority').value,status:$('status').value,telegramStatus:'pending',createdBy:me.email,createdAt:firebase.firestore.FieldValue.serverTimestamp()};try{const ref=await db.collection('complaints').add(c);try{const r=await telegram(c);await ref.update({telegramStatus:'sent',telegramMessageId:r.result?.message_id||null,telegramSentAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Complaint save + Telegram sent','success')}catch(t){await ref.update({telegramStatus:'failed',telegramError:String(t.message)});toast('Complaint save হয়েছে, Telegram failed','error')}e.target.reset()}catch(err){toast(err.message,'error')}finally{$('save').disabled=false}};
window.del=async id=>{if(!confirm('Delete this complaint?'))return;try{await db.collection('complaints').doc(id).delete();toast('Deleted','success')}catch(e){toast(e.message,'error')}};
</script></body></html>
